[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyniftireg"
version = "0.1.0"
description = "PyTorch reimplementation of NiftyReg-style registration: affine + B-spline stationary velocity fields."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "lochungtin" }]
keywords = ["registration", "niftyreg", "diffeomorphism", "svf", "b-spline", "mri", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
]

[project.optional-dependencies]
io = ["nibabel>=5.0"]
n4 = ["SimpleITK>=2.3"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pyniftireg[io,n4]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyniftireg"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["nibabel.*", "SimpleITK.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "gpu: requires a CUDA device",
    "slow: takes minutes; runs only with PYNIFTIREG_SLOW=1",
]
